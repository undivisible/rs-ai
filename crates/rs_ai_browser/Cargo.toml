[package]
name = "rs_ai_browser"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser-based local AI model detection for WASM targets (Chrome/Edge built-in AI)"

[features]
default = []
# Enable WASM bindings for Chrome Prompt API / Edge AI.
# Requires building with: wasm-pack build --target web
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys"]

[dependencies]
rs_ai_ai = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# WASM-only — only compiled when `wasm` feature is enabled.
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Navigator",
    "console",
    # Note: Chrome Prompt API types (LanguageModel, LanguageModelCapabilities etc.)
    # are not yet in web-sys; they are bound manually via wasm_bindgen extern "C"
    # blocks in wasm_bridge.rs using the raw JS global.
] }
