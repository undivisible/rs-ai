[package]
name = "rs_ai_phi_silica"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "(UNSTABLE; in active development) Windows Phi Silica local runtime for the Rusty AI SDK"

[dependencies]
rs_ai_traits = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["AI", "AI_MachineLearning", "Foundation", "Storage_Streams", "Foundation_Collections"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(phi_silica_bridge)'] }
