[package]
name = "rs_ai_local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
links = "rs_ai_local"

[features]
default = []
browser = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
gemini-nano = ["dep:jni", "dep:uniffi"]
foundationmodels = ["dep:uniffi"]
phi-silica = []

[dependencies]
rs_ai_core = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
futures-core = "0.3"
futures-channel = "0.3"

uniffi = { version = "0.31", optional = true }
jni = { version = "0.21", features = ["invocation"], optional = true }

wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Navigator", "console"] }

[lib]
name = "rs_ai_local"
crate-type = ["lib", "cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(phi_silica_bridge)', 'cfg(foundation_models_bridge)'] }