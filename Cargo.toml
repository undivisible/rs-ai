[workspace]
resolver = "2"
members = [
    "crates/rs_ai_ai",
    "crates/rs_ai_middleware",
    "crates/rs_ai_ui_stream",
    "crates/rs_ai_testing",
    "crates/rs_ai_chatgpt",
    "crates/rs_ai_claude",
    "crates/rs_ai_gemini",
    "crates/rs_ai_openai_compatible",
    "crates/rs_ai_xai",
    "crates/rs_ai_cloudflare",
    "crates/rs_ai_observability",
    "crates/rs_ai_cache",
    "crates/rs_ai_portkey",
    "crates/rs_ai_langfuse",
    "crates/rs_ai",
    "crates/rs_ai_gemini_nano",
    "crates/rs_ai_foundationmodels",
    "crates/rs_ai_phi_silica",
    "crates/rs_ai_browser",
    "crates/rs_ai_ollama",
    "examples/basic_text",
    "examples/stream_text",
    "examples/generate_object",
    "examples/stream_object",
    "examples/tool_loop",
    "examples/multimodal",
    "examples/local_android",
    "examples/local_apple",
    "examples/local_windows",
    "examples/router",
    "examples/realtime_voice",
    "examples/gemini_live",
    "examples/agent_with_tools",
    "examples/streaming_tool_use",
    "examples/fluent_api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/undivisible/rusty_ai"

[workspace.dependencies]
# Core
rs_ai_ai = { path = "crates/rs_ai_ai" }
rs_ai_middleware = { path = "crates/rs_ai_middleware" }
rs_ai_ui_stream = { path = "crates/rs_ai_ui_stream" }
rs_ai_testing = { path = "crates/rs_ai_testing" }

# Cloud providers
rs_ai_chatgpt = { path = "crates/rs_ai_chatgpt" }
rs_ai_claude = { path = "crates/rs_ai_claude" }
rs_ai_gemini = { path = "crates/rs_ai_gemini" }
rs_ai_openai_compatible = { path = "crates/rs_ai_openai_compatible" }
rs_ai_xai = { path = "crates/rs_ai_xai" }
rs_ai_cloudflare = { path = "crates/rs_ai_cloudflare" }
rs_ai_observability = { path = "crates/rs_ai_observability" }
rs_ai_cache = { path = "crates/rs_ai_cache" }
rs_ai_portkey = { path = "crates/rs_ai_portkey" }
rs_ai_langfuse = { path = "crates/rs_ai_langfuse" }
rs_ai = { path = "crates/rs_ai" }

# Local / platform runtimes
rs_ai_gemini_nano = { path = "crates/rs_ai_gemini_nano" }
rs_ai_foundationmodels = { path = "crates/rs_ai_foundationmodels" }
rs_ai_phi_silica = { path = "crates/rs_ai_phi_silica" }
rs_ai_browser = { path = "crates/rs_ai_browser" }
rs_ai_ollama = { path = "crates/rs_ai_ollama" }

# Async / streaming
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
eventsource-stream = "0.2"

# Observability
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Misc
bytes = "1"
url = "2"
secrecy = "0.10"
base64 = "0.22"
mime = "0.3"

# Real-time APIs (WebSocket)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# WASM and platform-specific dependencies should be added to individual crates
# See CRATE_AUDIT.md for recommended dependencies by crate:
# - wasm-bindgen, web-sys for rs_ai_browser (WASM target)
# - mockall, proptest, wiremock for testing crates
