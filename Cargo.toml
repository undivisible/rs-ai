[workspace]
resolver = "2"
members = [
    "crates/rai_ai",
    "crates/rai_middleware",
    "crates/rai_ui_stream",
    "crates/rai_testing",
    "crates/rai_chatgpt",
    "crates/rai_claude",
    "crates/rai_gemini",
    "crates/rai_openai_compatible",
    "crates/rai_simple",
    "crates/rai_gemini_nano",
    "crates/rai_foundationmodels",
    "crates/rai_phi_silica",
    "crates/rai_browser",
    "crates/rai_ollama",
    "examples/basic_text",
    "examples/stream_text",
    "examples/generate_object",
    "examples/stream_object",
    "examples/tool_loop",
    "examples/multimodal",
    "examples/local_android",
    "examples/local_apple",
    "examples/local_windows",
    "examples/router",
    "examples/realtime_voice",
    "examples/gemini_live",
    "examples/agent_with_tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
repository = "https://github.com/undivisible/rusty_ai"

[workspace.dependencies]
# Core
rai_ai = { path = "crates/rai_ai" }
rai_middleware = { path = "crates/rai_middleware" }
rai_ui_stream = { path = "crates/rai_ui_stream" }
rai_testing = { path = "crates/rai_testing" }

# Cloud providers
rai_chatgpt = { path = "crates/rai_chatgpt" }
rai_claude = { path = "crates/rai_claude" }
rai_gemini = { path = "crates/rai_gemini" }
rai_openai_compatible = { path = "crates/rai_openai_compatible" }
rai_simple = { path = "crates/rai_simple" }

# Local / platform runtimes
rai_gemini_nano = { path = "crates/rai_gemini_nano" }
rai_foundationmodels = { path = "crates/rai_foundationmodels" }
rai_phi_silica = { path = "crates/rai_phi_silica" }
rai_browser = { path = "crates/rai_browser" }
rai_ollama = { path = "crates/rai_ollama" }

# Async / streaming
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"
tokio-stream = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
eventsource-stream = "0.2"

# Observability
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# Misc
bytes = "1"
url = "2"
secrecy = "0.10"
base64 = "0.22"
mime = "0.3"

# Real-time APIs (WebSocket)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# WASM and platform-specific dependencies should be added to individual crates
# See CRATE_AUDIT.md for recommended dependencies by crate:
# - wasm-bindgen, web-sys for rai_browser (WASM target)
# - mockall, proptest, wiremock for testing crates
